name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/test/**'
              - 'backend/prisma/**'
              - 'backend/package*.json'
              - 'backend/tsconfig*.json'
              - 'backend/eslint.config.mjs'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package*.json'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.ts'
              - 'frontend/vitest.config.ts'
              - 'frontend/eslint.config.js'
            ci:
              - '.github/workflows/**'
              - 'commitlint.config.js'

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root deps
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Validate push commits
        if: github.event_name == 'push'
        run: |
          npx commitlint \
            --from ${{ github.event.before }} \
            --to ${{ github.event.after }} \
            --verbose

  setup:
    name: Monorepo — Prepare Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key-gen.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Generate Cache Key
        id: cache-key-gen
        run: |
          echo "key=${{ runner.os }}-monorepo-deps-${{ hashFiles('package-lock.json', 'backend/prisma/schema.prisma') }}" >> $GITHUB_OUTPUT

      - name: Cache Node Modules & Prisma
        id: monorepo-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ steps.cache-key-gen.outputs.key }}

      - name: Install & Generate (On Cache Miss)
        if: steps.monorepo-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
          cd backend && npx prisma generate

  backend-lint:
    name: Backend — Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: backend/.eslintcache
          key: ${{ runner.os }}-backend-eslint-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-backend-eslint-

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Test Compiler (Backend)
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache
          key: ${{ runner.os }}-backend-compiler-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-compiler-

      - name: Unit tests + coverage
        working-directory: backend
        run: npm run test:cov -- --ci --forceExit --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-e2e:
    name: Backend — E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, backend-lint, backend-test]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quizdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quizdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/quizdb
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run E2E tests
        working-directory: backend
        run: npm run test:e2e -- --forceExit

  frontend-lint:
    name: Frontend — Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: frontend/.eslintcache
          key: ${{ runner.os }}-frontend-eslint-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-frontend-eslint-

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore Monorepo Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.cache/prisma
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache Vitest Compiler (Frontend)
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache
          key: ${{ runner.os }}-frontend-compiler-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-compiler-

      - name: Unit tests + coverage
        working-directory: frontend
        run: npm run test:cov -- --passWithNoTests --reporter=default --reporter=github-actions --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    needs:
      - commitlint
      - setup
      - backend-lint
      - backend-test
      - backend-e2e
      - frontend-lint
      - frontend-test
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate results
        run: |
          python3 - << 'EOF'
          import json, sys

          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = [
            name for name, job in needs.items()
            if job["result"] not in ("success", "skipped")
          ]
          if failed:
            print(f"Failed jobs: {failed}")
            sys.exit(1)
          print("All CI checks passed ✅")
          EOF